<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos · GEPAEd</title>
<meta name="description" content="Agenda de eventos e participações do GEPAEd.">
<meta property="og:type" content="website">
<meta property="og:title" content="Eventos · GEPAEd">
<meta property="og:description" content="Agenda de eventos e participações do GEPAEd.">
<meta property="og:image" content="https://gabrielfortes-nees.github.io/gepaed-site/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-nav"></div>

<section class="phead"><div class="wrap">
  <div class="crumb"><a href="index.html">Início</a> › Eventos</div>
  <h1>Eventos</h1>
  <p>Agenda do grupo e participações em eventos. Novidades em geral ficam em <a href="noticias.html" style="color:var(--gold);font-weight:600">Notícias</a>.</p>
</div></section>

<section class="band"><div class="wrap">
  <h2>Próximos eventos</h2>
  <p class="sub">Seminários, defesas e encontros.</p>
  <div class="grid g3" id="agenda"></div>
</div></section>

<section class="band alt"><div class="wrap">
  <h2>Participações e eventos realizados</h2>
  <p class="sub">Eventos de que o grupo participou ou organizou.</p>
  <div class="newsgrid" id="realizados"></div>
</div></section>

<div id="site-footer"></div>
<script src="noticias.js"></script>
<script src="common.js"></script>
<script>
const cor=window.GEPAED_CAT_COR||{};
// próximos eventos (agenda)
const ag=window.GEPAED_AGENDA||[];
document.getElementById('agenda').innerHTML = ag.length
  ? ag.map(e=>`<a class="card link" href="${e.link||'#'}"><div class="ic">▦</div><h3>${e.titulo}</h3>
      <p><strong style="color:var(--navy)">${e.dataLabel}</strong><br>${e.descricao||''}</p></a>`).join("")
  : `<div class="card"><div class="ic">▦</div><h3>Em breve</h3><p>Os próximos eventos aparecerão aqui.</p></div>`;
// eventos realizados (notícias marcadas como evento)
const cap=n=>n.capa?`background-image:url('${n.capa}');background-position:${n.capaPos||'center'};background-size:cover`:`background:${cor[n.categoria]||cor.default}`;
const evs=(window.GEPAED_NOTICIAS||[]).filter(n=>n.evento);
document.getElementById('realizados').innerHTML = evs.length
  ? evs.map(n=>`<a class="newscard" href="noticia.html?id=${n.id}">
      <div class="img" style="${cap(n)}"></div>
      <div class="body"><span class="catbadge">${n.categoria}</span><div class="date">${n.dataLabel||''}</div>
        <h3>${n.titulo}</h3><p>${n.resumo||''}</p>
        <div class="links"><span style="color:var(--gold);font-weight:600;font-size:13px">Ler notícia →</span></div></div></a>`).join("")
  : `<div class="card"><p style="color:var(--muted)">Sem registros ainda.</p></div>`;
</script>
</body>
</html>
